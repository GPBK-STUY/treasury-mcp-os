name: Publish to PyPI and MCP Registry

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing + MCP Registry GitHub OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches pyproject version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$PKG" ]; then echo "Tag v$TAG != pyproject $PKG"; exit 1; fi
          echo "VERSION=$PKG" >> "$GITHUB_ENV"

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*

      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/t
          /tmp/t/bin/pip install dist/*.whl
          /tmp/t/bin/python -c "from treasury_mcp_os import server; r = server.get_cash_position(); assert r['total_balance'] > 0; print('ok')"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Sync server.json version
        run: |
          jq --arg v "$VERSION" '.version=$v | .packages |= map(.version=$v)' server.json > s.tmp && mv s.tmp server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher validate
          ./mcp-publisher login github-oidc
          # PyPI can take a minute to serve a new release; retry a few times.
          for i in 1 2 3 4 5; do ./mcp-publisher publish && exit 0; echo "retry $i"; sleep 30; done
          exit 1
